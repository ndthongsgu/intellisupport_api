# APPLICATION
spring.application.name=intellisupport-api

# SERVER
server.port=${SERVER_PORT}

# DATABASE - POSTGRESQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# LOGGING
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ERROR HANDLING
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# JWT SETTINGS
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

# CORS SETTINGS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# OPENAPI / SWAGGER UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.show-actuator=true

# GEMINI AI INTEGRATION
gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL}
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models

